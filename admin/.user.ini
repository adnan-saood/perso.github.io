; Per-directory PHP settings (honoured by PHP-FPM) for the admin panel.
; The server default is 2M, too small for photos, PDFs and 3D models.
; (The local preview, php -S, ignores this file: tools/preview.sh passes the same values.)
upload_max_filesize = 64M
post_max_size = 70M
max_file_uploads = 50
max_execution_time = 120
